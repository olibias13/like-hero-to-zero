<?xml version="1.0" encoding="UTF-8" ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html"
	xmlns:f="jakarta.faces.core"
	xmlns:ui="jakarta.faces.facelets"
	xmlns:p="http://primefaces.org/ui"
	template="/WEB-INF/templates/layout.xhtml">
	<ui:define name="content">
		<section class="hero">
			<h1>Datenpflege</h1>
			<p class="muted">Angemeldet als #{sessionScope.user}</p>
		</section>
		<h:form id="form" styleClass="card">
			<p:messages id="msgs" closable="true" />
			<div class="field">
				<label for="land">Land</label>
				<p:selectOneMenu id="land" value="#{adminBean.countryId}" filter="true"
					filterMatchMode="contains" style="width:100%">
					<p:ajax listener="#{adminBean.onCountryChange}" update="tabelle" />
					<f:selectItem itemLabel="Land wählen" noSelectionOption="true" />
					<f:selectItems value="#{adminBean.countries}" var="c" itemLabel="#{c.name}" itemValue="#{c.id}" />
				</p:selectOneMenu>
			</div>
			<div class="field">
				<label for="jahr">Jahr</label>
				<p:inputNumber id="jahr" value="#{adminBean.year}" decimalPlaces="0" thousandSeparator=""
					minValue="1750" maxValue="2100" />
			</div>
			<div class="field">
				<label for="co2">CO₂ (Mio. Tonnen)</label>
				<p:inputNumber id="co2" value="#{adminBean.co2}" decimalPlaces="3" decimalSeparator="."
					thousandSeparator="" minValue="0" />
			</div>
			<p:commandButton value="Speichern" action="#{adminBean.save}" update="form" />
			<p:commandButton value="Abmelden" action="#{loginBean.logout}" ajax="false"
				styleClass="ui-button-secondary" style="margin-left:10px" />

			<p:dataTable id="tabelle" var="e" value="#{adminBean.emissions}" rows="10" paginator="true"
				style="margin-top:25px" emptyMessage="Land wählen, um die Werte zu sehen">
				<p:column headerText="Jahr"><h:outputText value="#{e.year}" /></p:column>
				<p:column headerText="CO₂ (Mio. Tonnen)"><h:outputText value="#{e.co2}" /></p:column>
			</p:dataTable>
		</h:form>
	</ui:define>
</ui:composition>
